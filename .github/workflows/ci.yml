
on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'test/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'test/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  # ── Backend: fast checks + core tests ─────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'backend/') || contains(github.event.head_commit.modified, 'test/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio black isort

      - name: Quick format check (black)
        run: |
          cd backend
          black . --check --line-length=120 --quiet

      - name: Quick import sort check (isort)
        run: |
          cd backend
          isort . --check-only --profile black --line-length 120 --quiet

      - name: Run core API tests only
        run: python -m pytest test/test_projects_api.py -v --asyncio-mode=auto

  # ── Frontend: quick checks + build ───────────────────────────────────
  frontend:
    name: Frontend (Node/Vue)
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'frontend/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Quick lint check
        working-directory: frontend
        run: npm run lint -- --quiet

      - name: Build check
        working-directory: frontend
        run: npm run build
